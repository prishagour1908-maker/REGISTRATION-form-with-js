<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
            text-align: center;
            font-family: cursive;
            font-size: 30px;
        }
        .form{
            border-radius: 5px;
        }
        .labels{
            border: 3px solid white;
            border-radius: 5px;
            padding: 4px ;
            width:auto;
        }
        button{
            border-radius: 5px;
            background-color: rgb(122, 184, 255);
            font-weight: bolder;
            
        }
    </style>
  </head>
  <body>
   
<div class="container bg-primary p-4 text-light card form">
    <h2><strong>Registration Form</strong></h2>

    <form onsubmit="return checkform()">

        <div class="labels">
        <label>Name</label>
        <input type="text" id="name">
        <div id="nameError" class="error"></div>
        </div>

        <br>
        <div class="labels">
        <label>Email</label>
        <input type="email" id="email" required>
        <div id="emailError" class="error"></div>
        </div>

        <br>
       <div class="labels">
        <label>Age</label>
        <input type="number" id="age">
        <div id="ageError" class="error"></div>
       </div>
         <br>
        <label for="eventName">Please choose your event!</label>
        <select id="eventName" required>
        <option value="">Select</option>
        <option value="Science Fair">Art workshop</option>
        <option value="Coding Workshop">Cooking Competiton</option>
        <option value="Art Competition">Maths quiz</option>
        <option value="Sports Day">Annual Function</option>
      </select>
<br>
        <button type="submit">REGISTER NOW</button>
<br>
        <p id="success"></p>
        
    </form>
</div>

<script>

function checkform(){
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("age").value;

document.getElementById("nameError").innerHTML = "";
document.getElementById("emailError").innerHTML = "";
document.getElementById("ageError").innerHTML = "";
document.getElementById("success").innerHTML = "";

if (name == ""){
    document.getElementById("nameError").innerHTML = "Name Cannot Be Empty";
    return false;
}

if (email == ""){
    document.getElementById("emailError").innerHTML = "email Cannot Be Empty";
    return false;
}

if (age == ""){
    document.getElementById("ageError").innerHTML = "age cannot be empty";
    return false;
}

document.getElementById("success").innerHTML = "Form Submitted! Thank You!";
return false;
}

</script>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
